.stk{position:absolute;pointer-events:none;color:#000;transform:rotate(var(--r));filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff);animation:pp .35s cubic-bezier(.3,1.6,.5,1) both}
